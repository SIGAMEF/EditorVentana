<style>
:root{--chrome:#DDE3E7;--panel:#F3F5F6;--ink:#1E2A33;--muted:#5A6873;--line:#B7C1C8;--accent:#0B6E99;--accent-soft:#D3E8F1;--stage:#59666F;--warn:#9A3B00}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--chrome);color:var(--ink);font:13px/1.35 "Segoe UI",Tahoma,Arial,sans-serif;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#top{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:6px 10px;background:var(--chrome);border-bottom:1px solid var(--line)}
#top b{font-size:15px;margin-right:8px;letter-spacing:-.01em}
.tb{height:30px;padding:0 10px;background:#fff;border:1px solid var(--line);border-radius:4px;white-space:nowrap}
.tb:hover{background:var(--accent-soft)}
.tb:disabled{opacity:.45;cursor:default}
.tb.main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tb.main:hover{background:#085A7E}
.tb.on{background:var(--accent-soft);border-color:var(--accent)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#zoomv{display:inline-block;min-width:44px;text-align:center}
#main{display:grid;grid-template-columns:240px 1fr 268px;min-height:0}
#left,#right{background:var(--panel);overflow:auto;min-height:0}
#left{border-right:1px solid var(--line);padding:8px}
#right{border-left:1px solid var(--line);padding:10px}
#left h2,#right h2{font-size:12px;font-weight:600;color:var(--muted);margin:12px 2px 5px}
#left h2:first-child{margin-top:2px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.tool{display:flex;align-items:center;gap:6px;min-height:32px;padding:3px 6px;background:transparent;border:1px solid transparent;border-radius:4px;text-align:left;font-size:12px;line-height:1.1}
.tool svg{flex:none;width:18px;height:18px}
.tool:hover{background:#E4EAED;border-color:var(--line)}
.tool.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tool.wide{grid-column:1/-1}
.trace{background:var(--accent-soft);border-radius:6px;padding:6px;margin:0 -2px}
.trace h2{margin-top:0!important;color:#084F6E!important}
.trace .tool:hover{background:#BEDDEA}
.trace .tool.on{background:var(--accent)}
#stage{background:var(--stage);overflow:auto;position:relative;min-width:0;min-height:0}
#paper{position:relative;margin:24px;display:inline-block;line-height:0;box-shadow:0 2px 14px rgba(0,0,0,.4)}
#cv{display:block;background:#fff;touch-action:none}
#editor{position:absolute;display:none;margin:0;padding:1px 3px;border:1px solid #D4007F;background:rgba(255,255,255,.72);outline:none;resize:none;overflow:hidden;line-height:1.2;z-index:5;color:#000}
#welcome{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
#welcome>div{background:var(--panel);border-radius:8px;padding:26px 28px;max-width:470px;box-shadow:0 8px 26px rgba(0,0,0,.35)}
#welcome h1{font-size:22px;margin:0 0 8px;line-height:1.2;letter-spacing:-.01em}
#welcome p{margin:0 0 16px;color:var(--muted)}
#welcome .acts{display:flex;flex-wrap:wrap;gap:8px}
#welcome .tb{height:36px}
#status{display:flex;gap:14px;align-items:center;min-height:26px;padding:3px 10px;background:var(--chrome);border-top:1px solid var(--line);color:var(--ink)}
#hint{flex:1;min-width:0}
#pos{color:var(--muted);white-space:nowrap}
.row{display:grid;grid-template-columns:82px 1fr;gap:6px;align-items:center;margin-bottom:5px}
.row>label,.row>span.l{color:var(--muted);font-size:12px}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:6px}
.four label{font-size:11px;color:var(--muted);display:block}
input[type=number],input[type=text],select,textarea.p{width:100%;min-width:0;height:26px;padding:2px 5px;background:#fff;border:1px solid var(--line);border-radius:3px}
textarea.p{height:auto;min-height:62px;resize:vertical;font-size:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:34px;height:26px;padding:1px;background:#fff;border:1px solid var(--line);border-radius:3px;flex:none}
.colors{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.sw{width:15px;height:15px;padding:0;border:1px solid rgba(0,0,0,.35);border-radius:2px}
.mini{height:26px;padding:0 7px;background:#fff;border:1px solid var(--line);border-radius:3px;font-size:12px}
.mini:hover{background:var(--accent-soft)}
.mini.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.chk{display:flex;align-items:center;gap:6px;margin-bottom:6px}
#right hr{border:0;border-top:1px solid var(--line);margin:12px 0}
#right .note{font-size:12px;color:var(--muted);margin:4px 2px 8px}
#motor{color:var(--muted);white-space:nowrap;cursor:help}
#motor.on{color:#1E7B34}
.ok{color:#1E7B34}.bad{color:var(--warn)}
#rtinfo{min-height:16px}
.arrows{display:grid;grid-template-columns:repeat(4,30px);gap:3px;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 14px;border-radius:5px;display:none;z-index:20;max-width:80vw}
@media (max-width:900px){#main{grid-template-columns:150px 1fr 200px}.tools{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="top">
  <b>Mesa de Calco</b>
  <button class="tb main" id="bOpenImg">Abrir captura</button>
  <button class="tb" id="bOpen">Abrir proyecto</button>
  <button class="tb" id="bSave" title="Ctrl+S">Guardar proyecto</button>
  <button class="tb main" id="bPng">Exportar imagen</button>
  <button class="tb" id="bCopy">Copiar imagen</button>
  <button class="tb" id="bNew">Nuevo</button>
  <span class="sep"></span>
  <button class="tb" id="bUndo" title="Ctrl+Z">Deshacer</button>
  <button class="tb" id="bRedo" title="Ctrl+Y">Rehacer</button>
  <span class="sep"></span>
  <button class="tb" id="bZo" aria-label="Alejar">−</button><span id="zoomv">100%</span><button class="tb" id="bZi" aria-label="Acercar">+</button>
  <button class="tb" id="bFit">Ajustar</button>
  <span class="sep"></span>
  <button class="tb" id="bGrid">Cuadrícula</button>
  <button class="tb" id="bSnap">Pegar a cuadrícula</button>
</div>
<div id="main">
  <aside id="left" aria-label="Herramientas"></aside>
  <main id="stage">
    <div id="paper"><canvas id="cv"></canvas><textarea id="editor" spellcheck="false"></textarea></div>
    <div id="welcome"><div>
      <h1>Abre una captura y calca encima</h1>
      <p>También puedes pegarla con Ctrl+V o arrastrarla aquí. Todo se queda en tu equipo: este archivo no usa internet.</p>

/* ---------- utilidades ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)}
function hint(m){$('#hint').textContent=m||HINTS[tool]||(WAND.has(tool)?'Clic sobre una caja de la captura para calcarla exacta, o arrastra para dibujarla. Esc termina.':'')}
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>nextId++;
function make(type,x,y,extra){const d=clone(DEF[type]);const o=Object.assign({id:uid(),type,x:Math.round(x),y:Math.round(y)},d,extra||{});if(LINEAR.has(type)&&!(extra&&'x2' in extra)){o.x2=o.x+d.x2;o.y2=o.y+d.y2}return o}
function bbox(o){if(LINEAR.has(o.type))return{x:Math.min(o.x,o.x2),y:Math.min(o.y,o.y2),w:Math.abs(o.x2-o.x),h:Math.abs(o.y2-o.y)};return{x:o.x,y:o.y,w:o.w,h:o.h}}
function snap(v){return snapGrid?Math.round(v/gridSize)*gridSize:Math.round(v)}
function hex(r,g,b){return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase()}
function mix(h,t,a){if(!h||h==='none')return h;const n=parseInt(h.slice(1),16),m=parseInt(t.slice(1),16),f=(s)=>Math.round(((n>>s)&255)*(1-a)+((m>>s)&255)*a);return hex(f(16),f(8),f(0))}
function esc(s){return String(s==null?'':s)}
function save(){undoS.push(JSON.stringify(doc));let gc=redoS.length>0;if(undoS.length>120){undoS.shift();gc=true}redoS=[];if(gc)purgeAssets();syncBtns();autosave()}
function syncBtns(){$('#bUndo').disabled=!undoS.length;$('#bRedo').disabled=!redoS.length;$('#bGrid').classList.toggle('on',showGrid);$('#bSnap').classList.toggle('on',snapGrid);$('#zoomv').textContent=Math.round(zoom*100)+'%'}
function afterHistory(b0){doc.retouch=doc.retouch||[];if(doc.bg!==b0||retouchSig()!==bgSig)prepareBg();sel=[];panel();syncBtns();req();autosave()}
function undo(){endRt();if(mk){mk=null;setTool('select')}if(!undoS.length)return;redoS.push(JSON.stringify(doc));const b0=doc.bg;doc=JSON.parse(undoS.pop());afterHistory(b0)}
function redo(){endRt();if(mk){mk=null;setTool('select')}if(!redoS.length)return;undoS.push(JSON.stringify(doc));const b0=doc.bg;doc=JSON.parse(redoS.pop());afterHistory(b0)}
let asTimer;
function autosave(){clearTimeout(asTimer);asTimer=setTimeout(()=>{try{localStorage.setItem('mesaDeCalco',projectJSON())}catch(e){}},500)}
/* el proyecto guarda solo las imágenes que usa: captura original, recortes y teselas de retoque */
function usedAssets(d){const s=new Set();if(d.bg)s.add(d.bg);for(const o of d.objs)if(o.type==='image'&&o.asset)s.add(o.asset);for(const t of d.retouch||[])s.add(t.a);return s}
function purgeAssets(){const keep=usedAssets(doc),hist=undoS.concat(redoS);for(const id in assets){if(keep.has(id))continue;const q='"'+id+'"';if(hist.some(s=>s.includes(q)))continue;delete assets[id];delete imgCache[id];delete tileData[id]}}
function projectJSON(){const a={};for(const id of usedAssets(doc))if(assets[id])a[id]=assets[id];return JSON.stringify({app:'mesa-de-calco',version:2,doc,assets:a,nextId})}
function loadAsset(id){if(imgCache[id]||!assets[id])return;const im=new Image();im.onload=()=>req();im.src=assets[id];imgCache[id]=im}
function addAsset(src){const id='a'+uid();assets[id]=src;loadAsset(id);return id}
/* captura de fondo = original intacta + teselas de retoque aplicadas en orden. bgPx es siempre la imagen retocada */
function retouchSig(){return(doc.bg||'')+'|'+(doc.retouch||[]).map(t=>t.a+'@'+t.x+','+t.y).join(';')}
function prepareBg(cb){
 if(!doc.bg){bgPx=null;bgImg=null;bgOrig=null;bgSig='';req();return}
 const list=doc.retouch||(doc.retouch=[]),need=[];
 if(!bgOrig||bgOrig.id!==doc.bg)need.push(doc.bg);
 for(const t of list)if(!tileData[t.a]&&!need.includes(t.a))need.push(t.a);
 if(need.length){const tok=prepareBg.tok=(prepareBg.tok||0)+1;
  Promise.all(need.map(id=>assets[id]?decodePixels(assets[id]).then(r=>({id,r})):Promise.reject(new Error('Falta la imagen '+id)))).then(res=>{
   for(const {id,r} of res){if(id===doc.bg)bgOrig={id,cv:r.cv,data:r.data,alpha:hasAlpha(r.data.data)};else tileData[id]=r.data}
   if(tok===prepareBg.tok)prepareBg(cb)}).catch(e=>{console.error(e);toast('No pude leer la captura o uno de sus retoques.')});
  return}
 composeBg();if(cb)cb();
}
function composeBg(){const W=bgOrig.data.width,H=bgOrig.data.height,img=new ImageData(new Uint8ClampedArray(bgOrig.data.data),W,H);
 for(const t of doc.retouch||[]){const td=tileData[t.a];if(td)blit(img,td,t.x,t.y)}
 let c=bgPx&&bgPx.cv;if(!c||c.width!==W||c.height!==H){c=document.createElement('canvas');c.width=W;c.height=H}
 c.getContext('2d').putImageData(img,0,0);bgPx={w:W,h:H,d:img.data,cv:c,img};bgImg=c;bgSig=retouchSig();req()}

/* ---------- dibujo de controles ---------- */
function setFont(g,o,size){g.font=`${o.italic?'italic ':''}${o.bold?'bold ':''}${size||o.fs||13}px ${FONT}`}
function hline(g,x1,y1,x2,c){g.fillStyle=c;g.fillRect(x1,y1,x2-x1,1)}
function vline(g,x1,y1,y2,c){g.fillStyle=c;g.fillRect(x1,y1,1,y2-y1)}
function sunken(g,x,y,w,h,fill,stroke){x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);if(fill&&fill!=='none'){g.fillStyle=fill;g.fillRect(x,y,w,h)}const s=stroke&&stroke!=='none'?stroke:'#6E6E6E';hline(g,x,y,x+w,s);vline(g,x,y,y+h,s);const l=mix(s,'#FFFFFF',.6);hline(g,x,y+h-1,x+w,l);vline(g,x+w-1,y,y+h,l)}
function raised(g,x,y,w,h,fill,stroke){x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);g.fillStyle=fill==='none'?'#F0F0F0':fill;g.fillRect(x,y,w,h);hline(g,x,y,x+w,'#FFFFFF');vline(g,x,y,y+h,'#FFFFFF');const s=stroke&&stroke!=='none'?stroke:'#808080';hline(g,x,y+h-1,x+w,s);vline(g,x+w-1,y,y+h,s);hline(g,x+1,y+h-2,x+w-1,mix(s,'#FFFFFF',.45));vline(g,x+w-2,y+1,y+h-1,mix(s,'#FFFFFF',.45))}
function tri(g,cx,cy,dir,c,s){s=s||4;g.fillStyle=c;g.beginPath();if(dir==='d'){g.moveTo(cx-s,cy-s/2);g.lineTo(cx+s,cy-s/2);g.lineTo(cx,cy+s/2+1)}else if(dir==='u'){g.moveTo(cx-s,cy+s/2);g.lineTo(cx+s,cy+s/2);g.lineTo(cx,cy-s/2-1)}else if(dir==='l'){g.moveTo(cx+s/2,cy-s);g.lineTo(cx+s/2,cy+s);g.lineTo(cx-s/2-1,cy)}else{g.moveTo(cx-s/2,cy-s);g.lineTo(cx-s/2,cy+s);g.lineTo(cx+s/2+1,cy)}g.closePath();g.fill()}
function wrap(g,text,maxW){const out=[];for(const para of esc(text).split('\n')){if(!maxW){out.push(para);continue}let cur='';for(const w of para.split(' ')){const t=cur?cur+' '+w:w;if(g.measureText(t).width>maxW&&cur){out.push(cur);cur=w}else cur=t}out.push(cur)}return out}
function txt(g,o,x,y,w,h,opt){opt=opt||{};setFont(g,o,opt.size);g.fillStyle=opt.color||o.color||'#000';const al=opt.align||o.align||'left',lh=Math.round((opt.size||o.fs||13)*1.22),pad=opt.pad==null?3:opt.pad;g.textBaseline='middle';g.textAlign=al;const lines=wrap(g,opt.text!=null?opt.text:o.text,opt.wrap===false?0:w-pad*2);const tx=al==='center'?x+w/2:al==='right'?x+w-pad:x+pad;const total=lines.length*lh;let ty=opt.top?y+pad+lh/2:y+h/2-total/2+lh/2;g.save();g.beginPath();g.rect(x,y,w,h);g.clip();for(const l of lines){g.fillText(l,tx,Math.round(ty)+.5);ty+=lh}g.restore();g.textAlign='left'}
function dashes(g,o){g.setLineDash(o.dash?[Math.max(5,o.sw*3),Math.max(4,o.sw*2)]:[])}
function arrowHead(g,x1,y1,x2,y2,sw,c){const a=Math.atan2(y2-y1,x2-x1),s=Math.max(11,sw*4);g.fillStyle=c;g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-s*Math.cos(a-.42),y2-s*Math.sin(a-.42));g.lineTo(x2-s*Math.cos(a+.42),y2-s*Math.sin(a+.42));g.closePath();g.fill()}
function icon(g,name,x,y,w,h){const s=Math.min(w,h)*.62,cx=x+w/2,cy=y+h/2,l=cx-s/2,t=cy-s/2;g.save();if(name==='save'){g.fillStyle='#14324F';g.fillRect(l,t,s,s);g.fillStyle='#FFFFFF';g.fillRect(l+s*.2,t,s*.6,s*.42);g.fillStyle='#14324F';g.fillRect(l+s*.58,t+s*.05,s*.13,s*.28);g.fillStyle='#B8C4CE';g.fillRect(l+s*.25,t+s*.58,s*.5,s*.42)}
 else if(name==='exit'){g.fillStyle='#16A3A3';g.fillRect(l+s*.2,t,s*.5,s);g.fillStyle='#0B4C4C';g.fillRect(l+s*.2,t,s*.08,s);g.fillRect(l+s*.62,t,s*.08,s);g.fillStyle='#F3D34A';g.fillRect(l+s*.5,cy-1,s*.08,s*.08);tri(g,l+s*.88,cy,'r','#0B4C4C',s*.16)}
 else if(name==='print'){g.fillStyle='#E9E9E9';g.strokeStyle='#333';g.lineWidth=1;g.strokeRect(l+s*.2,t,s*.6,s*.32);g.fillStyle='#8F9AA3';g.fillRect(l,t+s*.32,s,s*.42);g.strokeRect(l,t+s*.32,s,s*.42);g.fillStyle='#FFF';g.fillRect(l+s*.2,t+s*.66,s*.6,s*.34);g.strokeRect(l+s*.2,t+s*.66,s*.6,s*.34)}
 else if(name==='back'){tri(g,l+s*.25,cy,'l','#16802F',s*.3);g.fillStyle='#16802F';g.fillRect(l+s*.3,cy-s*.12,s*.3,s*.24);g.fillStyle='#14324F';g.beginPath();g.arc(l+s*.8,cy,s*.2,0,7);g.fill()}
 g.restore()}

function drawObj(g,o){
 g.save();if(o.alpha!=null)g.globalAlpha=o.alpha;
 const {x,y,w,h,type:t}=o;

/* =====================================================================
   RETOQUE DE LA CAPTURA
   La captura original nunca se modifica. Cada retoque es una «tesela»:
   un rectángulo PNG sin pérdida que reemplaza esos píxeles. El historial
   solo guarda la lista de teselas, así que deshacer es exacto y liviano.
   ===================================================================== */
const RTOOLS=new Set(['rpatch','clone','heal','erase']);
let bgOrig=null,bgSig='',tileData={},rt=null,mk=null,hoverPt=null,textCache={};
const rtOpt={pmode:'exacto',feather:4,poisson:true,magnet:true,size:20,hard:100,aligned:true,cloneSrc:null,cloneOff:null,
 hmethod:'filas',hradius:3,etool:'varita',emode:'nuevo',tol:24,contig:true,ebrush:16,contract:0,halo:true};

/* --- píxeles --- */
function dataURLtoBlob(u){const i=u.indexOf(','),meta=u.slice(5,i),bin=meta.endsWith(';base64')?atob(u.slice(i+1)):decodeURIComponent(u.slice(i+1));const a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new Blob([a],{type:meta.split(';')[0]||'image/png'})}
async function decodePixels(src){let b;try{b=await createImageBitmap(dataURLtoBlob(src),{colorSpaceConversion:'none',premultiplyAlpha:'none'})}catch(e){b=await new Promise((ok,ko)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=ko;im.src=src})}
 const w=b.width||b.naturalWidth,h=b.height||b.naturalHeight,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(b,0,0);return{cv:c,data:g.getImageData(0,0,w,h)}}
function hasAlpha(d){for(let i=3;i<d.length;i+=4)if(d[i]<255)return true;return false}
function zeroClear(d){for(let i=0;i<d.length;i+=4)if(d[i+3]===0){d[i]=0;d[i+1]=0;d[i+2]=0}}
function idToCanvas(id){const c=document.createElement('canvas');c.width=id.width;c.height=id.height;c.getContext('2d').putImageData(id,0,0);return c}
function idToB64(id){return idToCanvas(id).toDataURL('image/png').split(',')[1]}
function inImg(x,y){return!!bgPx&&x>=0&&y>=0&&x<bgPx.w&&y<bgPx.h}
function clipRect(r){if(!bgPx||!r)return null;const x0=Math.max(0,Math.round(r.x)),y0=Math.max(0,Math.round(r.y)),x1=Math.min(bgPx.w,Math.round(r.x+r.w)),y1=Math.min(bgPx.h,Math.round(r.y+r.h));return x1>x0&&y1>y0?{x:x0,y:y0,w:x1-x0,h:y1-y0}:null}
function grab(r){const out=new ImageData(r.w,r.h),W=bgPx.w;for(let j=0;j<r.h;j++){const s=((r.y+j)*W+r.x)*4;out.data.set(bgPx.d.subarray(s,s+r.w*4),j*r.w*4)}return out}
function grabShift(D,dx,dy){const out=new ImageData(D.w,D.h),o=out.data,d=bgPx.d,W=bgPx.w,H=bgPx.h;for(let j=0;j<D.h;j++){const sy=Math.min(H-1,Math.max(0,D.y+j+dy));for(let i=0;i<D.w;i++){const sx=Math.min(W-1,Math.max(0,D.x+i+dx)),s=(sy*W+sx)*4,t=(j*D.w+i)*4;o[t]=d[s];o[t+1]=d[s+1];o[t+2]=d[s+2];o[t+3]=d[s+3]}}return out}
function blit(dst,src,x,y){const W=dst.width,H=dst.height,x0=Math.max(0,x),y0=Math.max(0,y),x1=Math.min(W,x+src.width),y1=Math.min(H,y+src.height);if(x1<=x0||y1<=y0)return;for(let yy=y0;yy<y1;yy++){const s=((yy-y)*src.width+(x0-x))*4;dst.data.set(src.data.subarray(s,s+(x1-x0)*4),(yy*W+x0)*4)}}
function drawChecker(g,x,y,w,h){if(!drawChecker.p){const c=document.createElement('canvas');c.width=c.height=16;const k=c.getContext('2d');k.fillStyle='#FFFFFF';k.fillRect(0,0,16,16);k.fillStyle='#D5D9DC';k.fillRect(0,0,8,8);k.fillRect(8,8,8,8);drawChecker.p=k.createPattern(c,'repeat')}g.save();g.fillStyle=drawChecker.p;g.fillRect(x,y,w,h);g.restore()}
/* guarda un retoque: tesela PNG + aplicación inmediata sobre la imagen retocada */
function commitTile(r,data,kind,noSave){if(!noSave)save();zeroClear(data.data);const a='a'+uid();assets[a]=idToCanvas(data).toDataURL('image/png');tileData[a]=data;doc.retouch.push({a,x:r.x,y:r.y,w:r.w,h:r.h,k:kind});blit(bgPx.img,data,r.x,r.y);bgPx.cv.getContext('2d').putImageData(data,r.x,r.y);bgSig=retouchSig();req();autosave();return a}

/* --- solucionador de Laplace (SOR): rellena incógnitas de forma suave a partir de los valores conocidos.
       fixed: 0 incógnita, 1 conocido, 2 fuera de la imagen --- */
function initFill(G,fixed,W,H,C){const L=new Int32Array(W*H),R=new Int32Array(W*H),T=new Int32Array(W*H),B=new Int32Array(W*H);
 for(let y=0;y<H;y++){let l=-1;for(let x=0;x<W;x++){const p=y*W+x;if(fixed[p]===1)l=x;L[p]=l}l=-1;for(let x=W-1;x>=0;x--){const p=y*W+x;if(fixed[p]===1)l=x;R[p]=l}}
 for(let x=0;x<W;x++){let l=-1;for(let y=0;y<H;y++){const p=y*W+x;if(fixed[p]===1)l=y;T[p]=l}l=-1;for(let y=H-1;y>=0;y--){const p=y*W+x;if(fixed[p]===1)l=y;B[p]=l}}
 for(let p=0;p<W*H;p++){if(fixed[p]!==0)continue;const x=p%W,y=(p-x)/W;let ws=0;const acc=[0,0,0,0];const add=(q,d)=>{const w=1/d;ws+=w;for(let c=0;c<C;c++)acc[c]+=G[q*C+c]*w};
  if(L[p]>=0)add(y*W+L[p],x-L[p]);if(R[p]>=0)add(y*W+R[p],R[p]-x);if(T[p]>=0)add(T[p]*W+x,y-T[p]);if(B[p]>=0)add(B[p]*W+x,B[p]-y);
  if(ws)for(let c=0;c<C;c++)G[p*C+c]=acc[c]/ws}}
function laplaceSolve(G,fixed,W,H,C,budget){const U=[];for(let p=0;p<W*H;p++)if(fixed[p]===0)U.push(p);const n=U.length;if(!n)return;
 const nb=new Int32Array(n*4),cnt=new Uint8Array(n);
 for(let k=0;k<n;k++){const p=U[k],x=p%W,y=(p-x)/W;let c=0;if(x>0&&fixed[p-1]!==2)nb[k*4+c++]=p-1;if(x<W-1&&fixed[p+1]!==2)nb[k*4+c++]=p+1;if(y>0&&fixed[p-W]!==2)nb[k*4+c++]=p-W;if(y<H-1&&fixed[p+W]!==2)nb[k*4+c++]=p+W;cnt[k]=c}
 initFill(G,fixed,W,H,C);
 const om=Math.min(1.94,2/(1+Math.sin(Math.PI/Math.max(4,W,H)))),t0=performance.now(),acc=new Float64Array(C);
 for(let it=0;it<6000;it++){let md=0;
  for(let k=0;k<n;k++){const c=cnt[k];if(!c)continue;const p=U[k]*C;acc.fill(0);for(let q=0;q<c;q++){const m=nb[k*4+q]*C;for(let ch=0;ch<C;ch++)acc[ch]+=G[m+ch]}
   for(let ch=0;ch<C;ch++){const dl=acc[ch]/c-G[p+ch];G[p+ch]+=om*dl;const a=dl<0?-dl:dl;if(a>md)md=a}}
  if(md<.02)break;if((it&7)===7&&performance.now()-t0>(budget||3000))break}}

/* --- BORRAR Y RELLENAR ---
   Cada fila se lee en sus dos extremos (izquierda/derecha) y cada columna arriba/abajo:
   - extremos iguales: la fila/columna se prolonga entera (líneas que cruzan siguen rectas);
   - solo un extremo distinto del fondo: es una línea o un área que entra por un lado.
     Las líneas finas (≤3 px) se prolongan hasta la línea que encuentran (esquinas y uniones en T);
     las áreas se prolongan hasta esa línea, sin pisarla (el interior de una caja no tapa su borde).
   Lo que no se puede deducir se interpola suave (Laplace). */
function healFill(D){const {x,y,w,h}=D,d=bgPx.d,W=bgPx.w,TOL=10;
 const at=(X,Y)=>inImg(X,Y)?(Y*W+X)*4:-1;
 const same=(i,j)=>Math.abs(d[i]-d[j])+Math.abs(d[i+1]-d[j+1])+Math.abs(d[i+2]-d[j+2])+Math.abs(d[i+3]-d[j+3])<=TOL;
 const cnt=new Map();let b0=-1,bn=0;const ring=[];for(let i=-1;i<=w;i++){ring.push(at(x+i,y-1),at(x+i,y+h))}for(let j=0;j<h;j++){ring.push(at(x-1,y+j),at(x+w,y+j))}
 for(const q of ring){if(q<0)continue;const k=(d[q]<<24|d[q+1]<<16|d[q+2]<<8|d[q+3])>>>0;const n=(cnt.get(k)||0)+1;cnt.set(k,n);if(n>bn){bn=n;b0=q}}
 const isB=q=>b0>=0&&same(q,b0),nonB=q=>q>=0&&!isB(q);
 /* tipo: 0 nada, 1 completa, 2 entra por el inicio (izq./arriba), 3 entra por el final (der./abajo) */
 const cls=(a,b)=>{if(a>=0&&b>=0){if(same(a,b))return[1,a];if(nonB(a)&&!nonB(b))return[2,a];if(nonB(b)&&!nonB(a))return[3,b];return[0,-1]}if(a>=0)return[1,a];if(b>=0)return[1,b];return[0,-1]};
 const rT=new Int8Array(h),rC=new Int32Array(h),cT=new Int8Array(w),cC=new Int32Array(w);
 for(let j=0;j<h;j++){const r=cls(at(x-1,y+j),at(x+w,y+j));rT[j]=r[0];rC[j]=r[1]}
 for(let i=0;i<w;i++){const r=cls(at(x+i,y-1),at(x+i,y+h));cT[i]=r[0];cC[i]=r[1]}
 /* línea fina: ≤3 px, distinta del fondo y que no continúa a lo largo del borde por donde entra (si continúa, es un área) */
 const thinOf=(T,C,n,side)=>{const t=new Uint8Array(n);let s=0;while(s<n){let e=s;if(T[s])while(e+1<n&&T[e+1]===T[s]&&same(C[e+1],C[s]))e++;
  if(T[s]&&nonB(C[s])&&e-s<3){const sd=T[s]===3?1:0,a=side(s-1,sd),b=side(e+1,sd);if(!((a>=0&&same(a,C[s]))||(b>=0&&same(b,C[s]))))for(let k=s;k<=e;k++)t[k]=1}s=e+1}return t};
 const rThin=thinOf(rT,rC,h,(k,sd)=>at(sd?x+w:x-1,y+k)),cThin=thinOf(cT,cC,w,(k,sd)=>at(x+k,sd?y+h:y-1));
 const ext=(T,thin,other,n,m)=>{const lo=new Int32Array(n).fill(-1),hi=new Int32Array(n).fill(-2);for(let k=0;k<n;k++){if(T[k]===2){let i=0;while(i<m&&!other[i])i++;if(i===m)continue;if(thin[k]){while(i+1<m&&other[i+1])i++;lo[k]=0;hi[k]=i}else{lo[k]=0;hi[k]=i-1}}
  else if(T[k]===3){let i=m-1;while(i>=0&&!other[i])i--;if(i<0)continue;if(thin[k]){while(i-1>=0&&other[i-1])i--;lo[k]=i;hi[k]=m-1}else{lo[k]=i+1;hi[k]=m-1}}}return{lo,hi}};
 const rE=ext(rT,rThin,cThin,h,w),cE=ext(cT,cThin,rThin,w,h);
 /* 1 = fila completa, 2 = columna completa, 3 = color fijo de la fila, 4 = color fijo de la columna, 0 = desconocido */
 const pick=(i,j)=>{const tr=rThin[j],tc=cThin[i],inR=i>=rE.lo[j]&&i<=rE.hi[j],inC=j>=cE.lo[i]&&j<=cE.hi[i];
  if(tr&&rT[j]===1)return 1;if(tc&&cT[i]===1)return 2;
  if(tr&&inR)return 3;if(tc&&inC)return 4;
  if(!tr&&inR)return 3;if(!tc&&inC)return 4;
  if(rT[j]===1)return 1;if(cT[i]===1)return 2;return 0};
 const GW=w+2,GH=h+2,C=4,G=new Float32Array(GW*GH*C),fixed=new Uint8Array(GW*GH);
 const put=(p,q)=>{fixed[p]=1;for(let c=0;c<4;c++)G[p*C+c]=d[q+c]};
 /* fila/columna completa con extremos casi iguales: se interpola entre ambos (conserva degradados suaves); si son idénticos, es el mismo color exacto */
 const lerp=(p,a,b,t)=>{if(a<0||b<0||(d[a]===d[b]&&d[a+1]===d[b+1]&&d[a+2]===d[b+2]&&d[a+3]===d[b+3])){put(p,a>=0?a:b);return}fixed[p]=1;for(let c=0;c<4;c++)G[p*C+c]=Math.round(d[a+c]+(d[b+c]-d[a+c])*t)};
 for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const p=j*GW+i,X=x+i-1,Y=y+j-1;const edge=i===0||j===0||i===GW-1||j===GH-1;
  if(edge){const q=at(X,Y);if(q<0)fixed[p]=2;else put(p,q);continue}
  const k=pick(i-1,j-1);
  if(k===1)lerp(p,at(x-1,Y),at(x+w,Y),i/(w+1));else if(k===2)lerp(p,at(X,y-1),at(X,y+h),j/(h+1));else if(k===3)put(p,rC[j-1]);else if(k===4)put(p,cC[i-1])}
 laplaceSolve(G,fixed,GW,GH,C);
 const out=new ImageData(w,h),o=out.data;for(let j=0;j<h;j++)for(let i=0;i<w;i++){const p=((j+1)*GW+i+1)*C,t=(j*w+i)*4;for(let c=0;c<4;c++)o[t+c]=Math.round(G[p+c])}
 return out}
async function healMotor(D,method){const m=Math.max(16,rtOpt.hradius*4),Cr=clipRect({x:D.x-m,y:D.y-m,w:D.w+2*m,h:D.h+2*m});const img=grab(Cr),mask=new ImageData(Cr.w,Cr.h),md=mask.data;
 for(let j=0;j<Cr.h;j++)for(let i=0;i<Cr.w;i++){const X=Cr.x+i,Y=Cr.y+j,t=(j*Cr.w+i)*4,v=X>=D.x&&X<D.x+D.w&&Y>=D.y&&Y<D.y+D.h?255:0;md[t]=md[t+1]=md[t+2]=v;md[t+3]=255}
 const j=await motorPost('/rellenar',{imagen:idToB64(img),mascara:idToB64(mask),metodo:method,radio:rtOpt.hradius});
 const r=await decodePixels('data:image/png;base64,'+j.imagen);if(r.data.width!==Cr.w||r.data.height!==Cr.h)throw new Error('respuesta de tamaño inesperado');
 const out=new ImageData(D.w,D.h);for(let y=0;y<D.h;y++)for(let x=0;x<D.w;x++){const s=((D.y-Cr.y+y)*Cr.w+(D.x-Cr.x+x))*4,t=(y*D.w+x)*4,q=((D.y+y)*bgPx.w+D.x+x)*4;out.data[t]=r.data.data[s];out.data[t+1]=r.data.data[s+1];out.data[t+2]=r.data.data[s+2];out.data[t+3]=bgPx.d[q+3]}
 return out}

/* --- PARCHE --- */
const SEAMTOL=6;
function seam(D,dx,dy,limit,pts){const d=bgPx.d,W=bgPx.w;let bad=0,sum=0;
 const t=(x,y)=>{if(!inImg(x,y))return false;const sx=x+dx,sy=y+dy;let e;if(!inImg(sx,sy))e=1020;else{const i=(y*W+x)*4,j=(sy*W+sx)*4;e=Math.abs(d[i]-d[j])+Math.abs(d[i+1]-d[j+1])+Math.abs(d[i+2]-d[j+2])+Math.abs(d[i+3]-d[j+3])}sum+=e;if(e>SEAMTOL){bad++;if(pts)pts.push(x,y);if(bad>limit)return true}return false};
 for(let x=D.x-1;x<=D.x+D.w;x++)if(t(x,D.y-1)||t(x,D.y+D.h))return{bad,sum};
 for(let y=D.y;y<D.y+D.h;y++)if(t(D.x-1,y)||t(D.x+D.w,y))return{bad,sum};
 return{bad,sum}}
function srcValid(D,dx,dy){const sx=D.x+dx,sy=D.y+dy;if(sx<0||sy<0||sx+D.w>bgPx.w||sy+D.h>bgPx.h)return false;return!(sx<D.x+D.w&&sx+D.w>D.x&&sy<D.y+D.h&&sy+D.h>D.y)}
function complexity(D,dx,dy){const d=bgPx.d,W=bgPx.w;let n=0;for(let j=0;j<D.h;j++)for(let i=0;i<D.w;i++){const p=((D.y+dy+j)*W+D.x+dx+i)*4;if(i>0&&(d[p]!==d[p-4]||d[p+1]!==d[p-3]||d[p+2]!==d[p-2]))n++;if(j>0){const q=p-W*4;if(d[p]!==d[q]||d[p+1]!==d[q+1]||d[p+2]!==d[q+2])n++}}return n}
/* busca un origen cuyo contorno coincida con el de la zona: misma fila, misma columna y alrededores */
function findBest(D){const W=bgPx.w,H=bgPx.h,seen=new Set(),cands=[];const add=(dx,dy)=>{const k=dx*65536+dy;if(seen.has(k)||!srcValid(D,dx,dy))return;seen.add(k);cands.push([dx,dy,Math.abs(dx)+Math.abs(dy)])};
 for(let dx=-D.x;dx<=W-D.w-D.x;dx++)add(dx,0);for(let dy=-D.y;dy<=H-D.h-D.y;dy++)add(0,dy);
 const RX=Math.min(D.w+40,220),RY=Math.min(D.h+40,220);for(let dy=-RY;dy<=RY;dy++)for(let dx=-RX;dx<=RX;dx++)add(dx,dy);
 cands.sort((a,b)=>a[2]-b[2]);let bestBad=Infinity,ties=[];
 for(const c of cands){const s=seam(D,c[0],c[1],bestBad);if(s.bad<bestBad){bestBad=s.bad;ties=[c]}else if(s.bad===bestBad&&ties.length<60)ties.push(c)}
 if(!ties.length)return null;let best=null,bc=Infinity;for(const c of ties){const k=complexity(D,c[0],c[1]);if(k<bc){bc=k;best=c}}return{dx:best[0],dy:best[1],bad:bestBad}}
